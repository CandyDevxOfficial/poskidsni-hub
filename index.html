<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLARIS RUNNER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #ff5722;
            font-size: 24px;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        p.subtitle {
            color: #c5c6c7;
            font-size: 13px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45a29e;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            background-color: #ff5722;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e64a19;
        }
        .status-msg {
            margin-top: 14px;
            font-size: 13px;
            color: #66fcf1;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SOLARIS RUNNER</h1>
    <p class="subtitle">Secure Executable Script Engine</p>
    
    <textarea id="scriptInput" placeholder="วางสคริปต์ Lua ของคุณที่นี่..."></textarea>
    
    <button id="convertBtn" onclick="processScript()">⚡ Convert Script</button>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    function processScript() {
        const input = document.getElementById('scriptInput').value.trim();
        const status = document.getElementById('statusMsg');

        if (!input) {
            status.style.color = '#ff4d4d';
            status.innerText = '⚠️ กรุณาวางสคริปต์ก่อนทำการแปลง!';
            status.style.display = 'block';
            return;
        }

        // ตัวอย่างการครอบสคริปต์เพื่อนำไปใช้งาน
        const converted = `-- SOLARIS RUNNER EXECUTOR LOAD\nloadstring([[${input}]])()`;
        
        // คัดลอกผลลัพธ์ลง Clipboard
        navigator.clipboard.writeText(converted).then(() => {
            status.style.color = '#66fcf1';
            status.innerText = '✅ แปลงสคริปต์และคัดลอกลง Clipboard เรียบร้อยแล้ว!';
            status.style.display = 'block';
        }).catch(() => {
            status.style.color = '#66fcf1';
            status.innerText = '✅ แปลงสคริปต์สำเร็จ!';
            status.style.display = 'block';
        });
    }
</script>

</body>
</html>
